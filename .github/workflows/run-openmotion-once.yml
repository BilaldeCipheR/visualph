name: Recapture Openmotion once

on:
  push:
    branches:
      - agent/run-openmotion-recapture
    paths:
      - .github/workflows/run-openmotion-once.yml

permissions:
  contents: read

jobs:
  recapture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCREENSHOT_BUCKET: screenshots

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recapture Openmotion
        run: npm run screenshot -- --slug openmotion --refresh-after-days 30
