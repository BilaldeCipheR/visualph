name: Rehydrate and sample April sources once

on:
  push:
    branches:
      - rebuild/april-product-source-repair
    paths:
      - .github/workflows/rehydrate-april-sources-once.yml

permissions:
  contents: read

jobs:
  rehydrate-and-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rehydrate unresolved April source data
        run: npx tsx scripts/rehydrate-product-sources.ts --from 2026-04-01 --to 2026-04-30
      - name: Capture five-date sample
        run: |
          set -euo pipefail
          for slug in capycursor velo-10 cenote-2 chatgpt-images-2-0 wonder-2000; do
            npm run screenshot -- --slug "$slug" --prefer-media
          done
