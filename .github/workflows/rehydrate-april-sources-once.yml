name: Repair undersized April screenshots once

on:
  push:
    branches:
      - rebuild/april-product-source-repair
    paths:
      - .github/workflows/rehydrate-april-sources-once.yml

permissions:
  contents: read

jobs:
  repair-undersized:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replace flagged captures with Product Hunt media
        run: |
          set -uo pipefail
          failed=0
          for slug in askiva-ai openai-agents-sdk codex-2-0-by-openai chatgpt-shopping gpt-rosalind moti-the-challenge-app deduce elevenlabs-agent-templates music-marketplace-by-eleven-labs karmabox-2 the-autonomous-stack wp-copilot mintlocke wootrack-poas-plugin-for-woocommerce deconflict smuggl lifeos-5 roll-4 buddi-2 vector-by-zauth hipocampus intent-9 echotube pageon-ai-3-0 android-cli kyohansha supermind-5 happenstance-2 brew-finder android-studio-panda-4 flock-08ee34c8-d622-417f-8c47-432da06899e3 galaxybrain innogath crazzy-3 codeplanet input-soft asi-one lumen-tool folio-7 e-y-e-by-expert-chase apple-books-mcp my-hu google-app-for-desktop pilot5-ai; do
            if ! npm run screenshot -- --slug "$slug" --prefer-media; then
              echo "::warning::Capture failed for $slug; existing screenshot was preserved"
              failed=$((failed + 1))
            fi
          done
          echo "Failed replacements: $failed"
          test "$failed" -eq 0
