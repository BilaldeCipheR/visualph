name: Repair undersized March 2026 screenshots once

on:
  push:
    branches:
      - rebuild/march-2026-backfill
    paths:
      - .github/workflows/prepare-march-2026-once.yml

permissions:
  contents: read

jobs:
  repair-undersized:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rehydrate only affected March dates
        run: |
          set -euo pipefail
          for date in 2026-03-06 2026-03-07 2026-03-12 2026-03-18 2026-03-19 2026-03-21 2026-03-24 2026-03-26 2026-03-27 2026-03-30; do
            npx tsx scripts/rehydrate-product-sources.ts --from "$date" --to "$date" --max-screenshot-bytes 20000
            sleep 3
          done
      - name: Replace flagged website captures
        run: |
          set -uo pipefail
          failed=0
          for slug in gpt-5-4-5 codex-security gpt-5-4-mini-and-nano contral universal-cli-by-composio volumeglass doodles-ai fastergh inspekt library-in-chatgpt gb1-the-ai-from-the-uk halo-vision-headphones cursor-glass-2 whisker superturtle luzo mobilescreen; do
            if ! npm run screenshot -- --slug "$slug" --prefer-media; then
              echo "::warning::Capture failed for $slug; existing screenshot was preserved"
              failed=$((failed + 1))
            fi
          done
          echo "Failed replacements: $failed"
          test "$failed" -eq 0
