name: Capture remaining March 2026 once

on:
  push:
    branches:
      - rebuild/march-2026-backfill
    paths:
      - .github/workflows/prepare-march-2026-once.yml

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: march-01-08
            start_day: 1
            end_day: 8
          - label: march-09-16
            start_day: 9
            end_day: 16
          - label: march-17-24
            start_day: 17
            end_day: 24
          - label: march-25-31
            start_day: 25
            end_day: 31
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture date batches
        run: |
          set -uo pipefail
          failed_dates=0
          for day_num in $(seq ${{ matrix.start_day }} ${{ matrix.end_day }}); do
            day=$(printf '%02d' "$day_num")
            date="2026-03-$day"
            echo "::group::Capturing $date (maximum 50 products)"
            if ! npm run screenshot -- --date "$date" --prefer-media --limit 50; then
              echo "::warning::Unresolved screenshots remain for $date"
              failed_dates=$((failed_dates + 1))
            fi
            echo "::endgroup::"
          done
          echo "Dates with unresolved capture attempts: $failed_dates"
          test "$failed_dates" -eq 0
