name: Repair undersized March 2026 screenshots once

on:
  push:
    branches:
      - rebuild/march-2026-backfill
    paths:
      - .github/workflows/prepare-march-2026-once.yml

permissions:
  contents: read

jobs:
  repair-known-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replace captures with stored Product Hunt media
        run: |
          set -euo pipefail
          for slug in codex-security fastergh gpt-5-4-5 volumeglass; do
            npm run screenshot -- --slug "$slug" --prefer-media
          done
