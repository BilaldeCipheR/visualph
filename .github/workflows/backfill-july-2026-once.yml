name: Backfill July 2026 Once

on:
  push:
    branches:
      - agent/july-2026-backfill
    paths:
      - .github/workflows/backfill-july-2026-once.yml
  workflow_dispatch:

concurrency:
  group: backfill-july-2026-once
  cancel-in-progress: false

jobs:
  convert:
    name: Convert ${{ matrix.from }} to ${{ matrix.to }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - from: "2026-07-24"
            to: "2026-07-30"
          - from: "2026-07-17"
            to: "2026-07-23"
          - from: "2026-07-10"
            to: "2026-07-16"
          - from: "2026-07-03"
            to: "2026-07-09"
          - from: "2026-07-01"
            to: "2026-07-02"

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert stored screenshots to WebP
        run: npx tsx scripts/convert-legacy-screenshots.ts --from "${{ matrix.from }}" --to "${{ matrix.to }}"
