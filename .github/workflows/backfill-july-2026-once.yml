name: Backfill July 2026 Once

on:
  push:
    branches:
      - agent/july-2026-backfill
    paths:
      - .github/workflows/backfill-july-2026-once.yml
  workflow_dispatch:

concurrency:
  group: backfill-july-2026-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Capture ${{ matrix.start_date }} (${{ matrix.days }} days)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - start_date: "2026-07-30"
            days: 7
          - start_date: "2026-07-23"
            days: 7
          - start_date: "2026-07-16"
            days: 7
          - start_date: "2026-07-09"
            days: 7
          - start_date: "2026-07-02"
            days: 2

    env:
      BACKFILL_START_DATE: ${{ matrix.start_date }}
      BACKFILL_DAYS: ${{ matrix.days }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture batch as WebP
        shell: bash
        run: |
          set -euo pipefail
          for offset in $(seq 0 $((BACKFILL_DAYS - 1))); do
            launch_date=$(date -u -d "$BACKFILL_START_DATE - $offset days" +%F)
            echo "Generating WebP screenshots for $launch_date"
            npm run screenshot -- --all --date "$launch_date" --refresh-after-days 30
          done
