name: Repair Missing May 2026 Screenshots

on:
  push:
    branches:
      - agent/may-2026-backfill
    paths:
      - .github/workflows/backfill-may-2026-once.yml
  workflow_dispatch:

concurrency:
  group: repair-may-2026-once
  cancel-in-progress: true

jobs:
  repair:
    name: Capture 20 missing May products
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture missing products as WebP
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for product_id in             2756 2737 2685 2700 2674 2668 2641 2653 2614 2578             2596 2514 2478 2392 2326 2162 2139 2122 2110 2082
          do
            if ! npm run screenshot -- --id "$product_id" --prefer-media; then
              failed+=("$product_id")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "Failed product ids: ${failed[*]}"
            exit 1
          fi
