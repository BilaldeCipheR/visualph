name: Capture remaining January 2026 screenshots once

on:
  push:
    branches:
      - rebuild/january-2026-backfill
    paths:
      - .github/workflows/prepare-january-2026-once.yml

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jan-01-08
            from: 2026-01-01
            to: 2026-01-08
          - name: jan-09-16
            from: 2026-01-09
            to: 2026-01-16
          - name: jan-17-24
            from: 2026-01-17
            to: 2026-01-24
          - name: jan-25-31
            from: 2026-01-25
            to: 2026-01-31
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture bounded date range
        env:
          RANGE_FROM: ${{ matrix.from }}
          RANGE_TO: ${{ matrix.to }}
        run: |
          set -euo pipefail
          current="$RANGE_FROM"
          while [[ "$current" < "$RANGE_TO" || "$current" == "$RANGE_TO" ]]; do
            echo "Capturing $current"
            npm run screenshot -- --all --date "$current" --limit 50 --prefer-media
            current=$(date -u -d "$current + 1 day" +%F)
          done
