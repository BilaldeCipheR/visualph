name: Improve Remaining June 2026 Screenshots Once

on:
  push:
    branches:
      - agent/june-2026-backfill
    paths:
      - .github/workflows/backfill-june-2026-once.yml
  workflow_dispatch:

concurrency:
  group: backfill-june-2026-once
  cancel-in-progress: true

jobs:
  improve:
    name: Improve remaining weak June captures
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Attempt each quality replacement independently
        shell: bash
        run: |
          set -uo pipefail
          slugs=(
            "avatars-in-elevencreative"
            "plenx-plex-client-for-nintendo-switch"
            "walrus-memory"
            "tinkerfont"
            "agentbrowse"
          )

          for slug in "${slugs[@]}"; do
            echo "Recapturing $slug"
            if ! npm run screenshot -- --slug "$slug" --prefer-media; then
              echo "::warning::Could not improve $slug; preserved its existing screenshot"
            fi
          done
