name: Backfill June 2026 Once

on:
  push:
    branches:
      - agent/june-2026-backfill
    paths:
      - .github/workflows/backfill-june-2026-once.yml
  workflow_dispatch:

concurrency:
  group: backfill-june-2026-once
  cancel-in-progress: true

jobs:
  convert:
    name: Convert ${{ matrix.from }} to ${{ matrix.to }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - from: "2026-06-24"
            to: "2026-06-30"
          - from: "2026-06-17"
            to: "2026-06-23"
          - from: "2026-06-10"
            to: "2026-06-16"
          - from: "2026-06-03"
            to: "2026-06-09"
          - from: "2026-06-01"
            to: "2026-06-02"

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert stored screenshots to WebP
        run: npm run screenshots:convert -- --from "${{ matrix.from }}" --to "${{ matrix.to }}"
