name: Recapture Corrected June 2026 Products Once

on:
  push:
    branches:
      - agent/june-2026-backfill
    paths:
      - .github/workflows/backfill-june-2026-once.yml
  workflow_dispatch:

concurrency:
  group: backfill-june-2026-once
  cancel-in-progress: true

jobs:
  recapture:
    name: Capture four corrected official product pages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture corrected official pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(
            "avatars-in-elevencreative"
            "plenx-plex-client-for-nintendo-switch"
            "rodeo-by-twelvelabs"
            "walrus-memory"
          )

          for slug in "${slugs[@]}"; do
            echo "Recapturing $slug"
            npm run screenshot -- --slug "$slug"
          done
