name: Validate April source repair

on:
  push:
    branches:
      - rebuild/april-product-source-repair
    paths:
      - .github/workflows/validate-april-source-repair.yml
      - lib/product-hunt/fetch-products.ts
      - lib/screenshot-fallback.ts
      - scripts/rehydrate-product-sources.ts
      - tests/product-hunt-media.test.ts
      - tests/screenshot-fallback.test.ts
      - supabase/migrations/20260825090000_persist_product_hunt_thumbnail.sql

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
