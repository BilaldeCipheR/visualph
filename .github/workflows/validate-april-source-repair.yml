name: Validate April source repair

on:
  push:
    branches:
      - rebuild/april-product-source-repair
    paths:
      - .github/workflows/validate-april-source-repair.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
