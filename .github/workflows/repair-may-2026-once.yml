name: Repair May 2026 screenshots once

on:
  push:
    branches:
      - agent/may-2026-quality-20260824
    paths:
      - .github/workflows/repair-may-2026-once.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Recapture weak May screenshots
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          slugs=(
            relay-c81c15ad-0524-4b02-919c-eb965efc036c
            voiser-ai-2
            chatgpt-for-personal-finance
            ai-shadowing
            wubble-ai
            airbag-2
            greenfi-ai
            greenfi-ai-2
            elevencreative-flows
            circadiaos
          )
          failed=0
          for slug in "${slugs[@]}"; do
            echo "::group::Recapturing $slug"
            if ! npm run screenshot -- --slug "$slug" --prefer-media; then
              echo "::warning::Could not replace $slug; existing screenshot preserved"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Replacement attempts that preserved the previous image: $failed"
