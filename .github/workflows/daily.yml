name: Manual VisualPH sync

# Manual backfill plan
# --------------------
# This workflow intentionally has no cron schedule. Run it from
# GitHub Actions -> Manual VisualPH sync -> Run workflow.
#
# Supabase status checked on 2026-08-09:
# August 4 has 18 products; August 1-3 and 5-9 are missing.
# Run this catch-up first. Re-importing August 4 is safe:
#
#   start_date=2026-08-09  backfill_days=9   -> covers 2026-08-01..2026-08-09
#
# Then run the remaining historical batches one at a time, newest to oldest:
#
#   start_date=2026-04-18  backfill_days=30  -> covers 2026-03-20..2026-04-18
#   start_date=2026-03-19  backfill_days=30  -> covers 2026-02-18..2026-03-19
#   start_date=2026-02-17  backfill_days=30  -> covers 2026-01-19..2026-02-17
#   start_date=2026-01-18  backfill_days=18  -> covers 2026-01-01..2026-01-18
#
# Let each run finish before starting the next. The concurrency group also
# prevents overlapping imports if multiple runs are queued.

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Number of dates to import, counting backward from start_date (1-30)"
        required: true
        default: "1"
      start_date:
        description: "Newest date to import (YYYY-MM-DD); blank uses today (UTC)"
        required: false
        default: ""

concurrency:
  group: visualph-manual-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SCREENSHOT_BASE_URL: http://127.0.0.1:3000
      BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
      BACKFILL_START_DATE: ${{ inputs.start_date || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/visualph-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/visualph-start.log
          exit 1

      - name: Fetch Product Hunt launches
        run: |
          if ! [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]] || (( BACKFILL_DAYS < 1 || BACKFILL_DAYS > 30 )); then
            echo "backfill_days must be between 1 and 30"
            exit 1
          fi

          start_date="${BACKFILL_START_DATE:-$(date -u +%F)}"
          if ! [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
            ! date -u -d "$start_date" +%F >/dev/null 2>&1; then
            echo "start_date must use YYYY-MM-DD"
            exit 1
          fi

          for offset in $(seq 0 $((BACKFILL_DAYS - 1))); do
            launch_date=$(date -u -d "$start_date - $offset days" +%F)
            echo "Importing Product Hunt launches for $launch_date"
            curl --fail-with-body -sS -X POST "$APP_URL/api/fetch-products" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"date\":\"$launch_date\"}"
          done

      - name: Generate screenshots
        run: npm run screenshot -- --all
