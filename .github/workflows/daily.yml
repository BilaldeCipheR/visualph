name: VisualPH daily sync

on:
  schedule:
    - cron: "30 02 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Number of dates to import, counting backward from start_date (1-30)"
        required: true
        default: "1"
      start_date:
        description: "Newest date to import (YYYY-MM-DD); blank uses today for manual runs"
        required: false
        default: ""

concurrency:
  group: visualph-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SCREENSHOT_BASE_URL: http://127.0.0.1:3000
      BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
      BACKFILL_START_DATE: ${{ inputs.start_date || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/visualph-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/visualph-start.log
          exit 1

      - name: Fetch Product Hunt launches
        run: |
          if ! [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]] || (( BACKFILL_DAYS < 1 || BACKFILL_DAYS > 30 )); then
            echo "backfill_days must be between 1 and 30"
            exit 1
          fi

          # Accept either "YYYY-MM-DD" or a pasted "start_date=YYYY-MM-DD" value.
          start_date="${BACKFILL_START_DATE#start_date=}"
          if [[ -z "$start_date" && "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            start_date=$(date -u -d "yesterday" +%F)
          fi
          start_date="${start_date:-$(date -u +%F)}"
          if ! [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
            ! date -u -d "$start_date" +%F >/dev/null 2>&1; then
            echo "start_date must use YYYY-MM-DD"
            exit 1
          fi

          for offset in $(seq 0 $((BACKFILL_DAYS - 1))); do
            launch_date=$(date -u -d "$start_date - $offset days" +%F)
            echo "Importing Product Hunt launches for $launch_date"
            curl --fail-with-body -sS -X POST "$APP_URL/api/fetch-products" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"date\":\"$launch_date\"}"
          done

      - name: Generate screenshots
        run: npm run screenshot -- --limit 100 --refresh-after-days 30

      - name: Verify application health
        run: curl --fail-with-body -sS "$APP_URL/api/health"
