name: Daily VisualPH sync

# Backfill schedule
# ------------------
# The scheduled cron below only imports the current day, so historical
# dates must be backfilled manually via "Run workflow" (workflow_dispatch).
# `backfill_days` accepts at most 30, so backfilling a wide range requires
# several runs, each covering an earlier `start_date`.
#
# As of 2026-07-31, Supabase only has data for 2026-07-18 through
# 2026-07-30 (imported via a single manual run). To backfill back to
# 2026-01-01, trigger the following runs (newest to oldest), letting each
# one finish (~20+ min, since it also generates screenshots) before
# starting the next:
#
#   start_date=2026-07-17  backfill_days=30  -> covers 2026-06-18..2026-07-17
#   start_date=2026-06-17  backfill_days=30  -> covers 2026-05-19..2026-06-17
#   start_date=2026-05-18  backfill_days=30  -> covers 2026-04-19..2026-05-18
#   start_date=2026-04-18  backfill_days=30  -> covers 2026-03-20..2026-04-18
#   start_date=2026-03-19  backfill_days=30  -> covers 2026-02-18..2026-03-19
#   start_date=2026-02-17  backfill_days=30  -> covers 2026-01-19..2026-02-17
#   start_date=2026-01-18  backfill_days=18  -> covers 2026-01-01..2026-01-18
#
# Update this comment once the backfill is complete, or if new gaps appear.

on:
  schedule:
    - cron: "55 23 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Number of days to import, counting backward from today (max 30)"
        required: true
        default: "1"
      start_date:
        description: "Newest date to import (YYYY-MM-DD); leave blank for today"
        required: false
        default: ""

concurrency:
  group: visualph-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SCREENSHOT_BASE_URL: http://127.0.0.1:3000
      BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
      BACKFILL_START_DATE: ${{ inputs.start_date || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/visualph-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/visualph-start.log
          exit 1

      - name: Fetch Product Hunt launches
        run: |
          if ! [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]] || (( BACKFILL_DAYS < 1 || BACKFILL_DAYS > 30 )); then
            echo "backfill_days must be between 1 and 30"
            exit 1
          fi

          start_date="${BACKFILL_START_DATE:-$(date -u +%F)}"
          if ! [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
            ! date -u -d "$start_date" +%F >/dev/null 2>&1; then
            echo "start_date must use YYYY-MM-DD"
            exit 1
          fi

          for offset in $(seq 0 $((BACKFILL_DAYS - 1))); do
            launch_date=$(date -u -d "$start_date - $offset days" +%F)
            echo "Importing Product Hunt launches for $launch_date"
            curl --fail-with-body -sS -X POST "$APP_URL/api/fetch-products" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"date\":\"$launch_date\"}"
          done

      - name: Generate screenshots
        run: npm run screenshot -- --all
